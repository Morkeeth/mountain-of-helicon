# Mountain of Helicon release gate: product tests, package, frontend, and the
# memory exam it ships to other repositories.
name: release-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install with test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run complete suite
        run: |
          mkdir -p "$HOME/pytmp"
          TMPDIR="$HOME/pytmp" python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Verify launch scripts parse
        run: |
          python scripts/check_python.py
          bash -n scripts/demo.sh

  rot-exam:
    name: Agent-memory exam
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Mountain of Helicon (slim)
        run: pip install -e .
      - name: Run the rot exam on our own memory
        run: helicon ci --fail-on none

  # The job above proves the CLI works. It says nothing about `action.yml`, which
  # is the thing README tells a stranger to put in their workflow — a different
  # code path (composite action, its own inputs, its own install step) that had
  # never once been executed on a runner. A published action nobody has watched
  # run is a claim, not a check.
  #
  # So both directions are exercised here, against a fixture whose rot is planted
  # and must stay planted:
  #   fail-on: rot  must FAIL   — otherwise the gate cannot fail and means nothing
  #   fail-on: none must PASS   — otherwise report-only mode wedges other people's CI
  action-selftest:
    name: The Action itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Action must FAIL on a repo with rot
        id: should-fail
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/rotten-repo
          fail-on: rot

      - name: Assert it actually failed
        run: |
          if [ "${{ steps.should-fail.outcome }}" != "failure" ]; then
            echo "::error::The action passed on tests/fixtures/rotten-repo."
            echo "Either the planted rot was removed, or fail-on:rot no longer fails."
            echo "A gate that cannot fail is decoration — fix it, do not delete this."
            exit 1
          fi
          echo "fail-on:rot failed as designed."

      - name: Action must PASS the same repo in report-only mode
        uses: ./
        with:
          path: tests/fixtures/rotten-repo
          fail-on: none

  mac-app:
    name: Desktop app builds
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The Mac app is the product's front door and nothing tested it. A salvage
      # on 2026-08-10 ported WorkGraphView.swift without the models and fetchers
      # it calls, and `swift build` failed for four commits (5db661f..1c59a6d)
      # while the Python suite stayed green the whole time. A compile is the
      # cheapest possible check and it would have caught it on the first push.
      - name: swift build
        working-directory: mac
        run: swift build
