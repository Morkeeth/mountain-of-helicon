[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mountain-of-helicon"
version = "0.2.2"
description = "Check AGENTS.md and CLAUDE.md claims against the repository on disk"
readme = "README.md"
license = "MIT"
authors = [{name = "Oscar Morkeeth"}]
keywords = ["ai-agents", "agent-memory", "claude-code", "mcp", "governance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.10"
# The default install is the deterministic review (`helicon review`, `helicon-review`,
# `helicon truth`, `helicon ci`): standard library only. Nothing below is imported on
# that path, so nothing below is installed by default. A command that needs an extra
# prints the one `pip install` line that provides it (helicon/extras.py).
dependencies = []

[project.optional-dependencies]
# The web app: `helicon serve`, `helicon demo`, the HTTP API.
web = ["fastapi>=0.111.0", "uvicorn>=0.30.0", "pydantic>=2.0"]
# Model-backed commands: anything that calls Qwen or another OpenAI-compatible endpoint.
model = ["openai>=1.30.0"]
# The memory/retrieval lab: hybrid search, consolidation, identity resolution.
# Without it, search degrades to FTS5 keyword only.
retrieval = ["numpy>=1.26", "requests>=2.31"]
# Local semantic embeddings (pulls torch). Implies retrieval.
embeddings = ["sentence-transformers>=3.0", "numpy>=1.26", "requests>=2.31"]
# Everything the product can do.
all = ["mountain-of-helicon[web,model,retrieval,embeddings]"]

# The test path was never declared at all: pytest and the TestClient's HTTP
# transport were simply assumed present, so "which httpx" was whatever the
# machine happened to have. That is what the StarletteDeprecationWarning
# ("Using `httpx` with `starlette.testclient` is deprecated; install `httpx2`
# instead") is really reporting — an undeclared dependency drifting underneath
# every API test. httpx2 does not exist on PyPI yet, so the intended path is
# pinned to the 0.x line that starlette.testclient currently supports; when
# httpx2 ships, this line is the one place to change, and the API tests fail
# loudly at install time rather than mysteriously at runtime.
test = [
    "pytest>=8.0",
    "httpx>=0.27,<1.0",
]

[project.scripts]
helicon = "helicon.cli:main"
# This alias supports one-shot runners. The documented installed command is
# `helicon review <repo>`. Both commands use the same keyless review function.
helicon-review = "helicon.review:main"

[project.urls]
Homepage = "https://github.com/Morkeeth/mountain-of-helicon"
Repository = "https://github.com/Morkeeth/mountain-of-helicon"
Issues = "https://github.com/Morkeeth/mountain-of-helicon/issues"

[tool.setuptools.packages.find]
include = ["helicon*"]

[tool.pytest.ini_options]
# Deprecations are errors: the suite must not rot toward a Python upgrade.
# (utcnow was deprecated code in demo.py and 3 test files until Jul 29; with
# plain warnings the count had quietly grown to 162.) Third-party deprecations
# we cannot fix are ignored BY NAME, never wholesale.
filterwarnings = [
    "error::DeprecationWarning",
    # starlette's own deprecation class subclasses UserWarning, not
    # DeprecationWarning — ignored by message so nothing else hides behind it.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # Starlette 1.6 still imports AnyIO's compatibility alias. Keep every other
    # deprecation fatal while the upstream TestClient migrates to the new name.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated, use anyio.from_thread.BlockingPortal instead.",
]
