[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mount-helicon"
version = "0.1.0"
description = "Mount Helicon - test and trust layer for AI agent memory"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pyyaml>=6.0",
    "gitpython>=3.1.0",
    "numpy>=1.26",
]

# Semantic/hybrid retrieval is optional — without it, search degrades to FTS5
# keyword only (the deterministic rot exam, scan, CLI, and the CI Action all
# run slim, no torch). Full local experience: pip install "mount-helicon[embeddings]".
[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]

[project.scripts]
helicon = "helicon.cli:main"

[tool.setuptools.packages.find]
include = ["helicon*"]

[tool.pytest.ini_options]
# Deprecations are errors: the suite must not rot toward a Python upgrade.
# (utcnow was deprecated code in demo.py and 3 test files until Jul 29; with
# plain warnings the count had quietly grown to 162.) Third-party deprecations
# we cannot fix are ignored BY NAME, never wholesale.
filterwarnings = [
    "error::DeprecationWarning",
    # starlette's own deprecation class subclasses UserWarning, not
    # DeprecationWarning — ignored by message so nothing else hides behind it.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
