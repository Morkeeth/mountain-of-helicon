[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mountain-of-helicon"
version = "0.2.0"
description = "Mountain of Helicon — check whether your AGENTS.md lies to your coding agent — file:line evidence, no API key"
readme = "README.md"
license = "MIT"
authors = [{name = "Oscar Morkeeth"}]
keywords = ["ai-agents", "agent-memory", "claude-code", "mcp", "governance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pyyaml>=6.0",
    "gitpython>=3.1.0",
    "numpy>=1.26",
]

# Semantic/hybrid retrieval is optional — without it, search degrades to FTS5
# keyword only (the deterministic rot exam, scan, CLI, and the CI Action all
# run slim, no torch). Full local: pip install "mountain-of-helicon[embeddings]".
[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]

# The test path was never declared at all: pytest and the TestClient's HTTP
# transport were simply assumed present, so "which httpx" was whatever the
# machine happened to have. That is what the StarletteDeprecationWarning
# ("Using `httpx` with `starlette.testclient` is deprecated; install `httpx2`
# instead") is really reporting — an undeclared dependency drifting underneath
# every API test. httpx2 does not exist on PyPI yet, so the intended path is
# pinned to the 0.x line that starlette.testclient currently supports; when
# httpx2 ships, this line is the one place to change, and the API tests fail
# loudly at install time rather than mysteriously at runtime.
test = [
    "pytest>=8.0",
    "httpx>=0.27,<1.0",
]

[project.scripts]
helicon = "helicon.cli:main"
# One-line stranger entry: `uvx --from mountain-of-helicon helicon-review <repo>`
# (or `pipx run --spec mountain-of-helicon helicon-review <repo>`). No key, no LLM.
helicon-review = "helicon.review:main"

[project.urls]
Homepage = "https://github.com/Morkeeth/mountain-of-helicon"
Repository = "https://github.com/Morkeeth/mountain-of-helicon"
Issues = "https://github.com/Morkeeth/mountain-of-helicon/issues"

[tool.setuptools.packages.find]
include = ["helicon*"]

[tool.pytest.ini_options]
# Deprecations are errors: the suite must not rot toward a Python upgrade.
# (utcnow was deprecated code in demo.py and 3 test files until Jul 29; with
# plain warnings the count had quietly grown to 162.) Third-party deprecations
# we cannot fix are ignored BY NAME, never wholesale.
filterwarnings = [
    "error::DeprecationWarning",
    # starlette's own deprecation class subclasses UserWarning, not
    # DeprecationWarning — ignored by message so nothing else hides behind it.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # anyio 4.15+ deprecates anyio.abc.BlockingPortal; starlette.testclient
    # still imports the alias at module load. We cannot fix starlette from here.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]
